<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow | Modern Task Management</title>
  <meta name="description" content="Intuitive, modern task management dashboard with real-time tracking and REST API integration.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>TaskFlow</h1>
          <p>Productivity & Workflow Management</p>
        </div>
      </div>

      <div class="header-actions">
        <div id="connection-badge" class="connection-badge demo">
          <span class="status-dot"></span>
          <span id="connection-text">Checking Connection...</span>
        </div>

        <button id="new-task-btn" class="btn-primary" title="Press 'N' to create anywhere">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          <span>New Task</span>
        </button>
      </div>
    </header>

    <!-- Stats Section -->
    <section class="stats-grid" aria-label="Task Statistics">
      <div class="stat-card">
        <div class="stat-icon total">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <div class="stat-details">
          <h3>Total Tasks</h3>
          <div class="stat-value" id="stat-total">0</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon todo">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div class="stat-details">
          <h3>To Do</h3>
          <div class="stat-value" id="stat-todo">0</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon in-progress">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div class="stat-details">
          <h3>In Progress</h3>
          <div class="stat-value" id="stat-in-progress">0</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon completed">
          <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div class="stat-details">
          <h3>Completed</h3>
          <div class="stat-value" id="stat-completed">0</div>
        </div>
      </div>
    </section>

    <!-- Toolbar Filters & Search -->
    <div class="toolbar-card">
      <div class="search-box">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search tasks by title or description..." autocomplete="off">
      </div>

      <div class="filter-group">
        <button class="filter-pill active" data-status="all">
          <span>All</span>
          <span class="badge">0</span>
        </button>
        <button class="filter-pill" data-status="todo">
          <span>To Do</span>
          <span class="badge">0</span>
        </button>
        <button class="filter-pill" data-status="in_progress">
          <span>In Progress</span>
          <span class="badge">0</span>
        </button>
        <button class="filter-pill" data-status="completed">
          <span>Done</span>
          <span class="badge">0</span>
        </button>

        <div class="select-wrapper">
          <select id="priority-filter" aria-label="Filter by priority">
            <option value="all">All Priorities</option>
            <option value="high">High Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="low">Low Priority</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Kanban Columns -->
    <main class="kanban-board" id="kanban-board">
      <!-- Column: To Do -->
      <section class="kanban-column" id="col-todo">
        <div class="column-header">
          <div class="column-title">
            <span style="color: #94a3b8;">●</span>
            <span>To Do</span>
          </div>
          <span class="column-count" id="count-todo">0</span>
        </div>
        <div class="task-list" id="tasks-todo"></div>
      </section>

      <!-- Column: In Progress -->
      <section class="kanban-column" id="col-in-progress">
        <div class="column-header">
          <div class="column-title">
            <span style="color: #38bdf8;">●</span>
            <span>In Progress</span>
          </div>
          <span class="column-count" id="count-in-progress">0</span>
        </div>
        <div class="task-list" id="tasks-in-progress"></div>
      </section>

      <!-- Column: Completed -->
      <section class="kanban-column" id="col-completed">
        <div class="column-header">
          <div class="column-title">
            <span style="color: #34d399;">●</span>
            <span>Completed</span>
          </div>
          <span class="column-count" id="count-completed">0</span>
        </div>
        <div class="task-list" id="tasks-completed"></div>
      </section>
    </main>
  </div>

  <!-- Task Modal (Create & Edit) -->
  <dialog id="task-modal" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title">Create New Task</h2>
      <button type="button" class="close-btn close-modal" aria-label="Close dialog">✕</button>
    </div>
    <form id="task-form">
      <input type="hidden" id="task-id">
      <div class="modal-body">
        <div class="form-group">
          <label for="task-title">Title *</label>
          <input type="text" id="task-title" required placeholder="e.g. Design authentication workflow" maxlength="255">
        </div>

        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" placeholder="Add helpful details, acceptance criteria, or notes..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-status">Status</label>
            <select id="task-status">
              <option value="todo">To Do</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="task-due-date">Due Date</label>
          <input type="date" id="task-due-date">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary close-modal">Cancel</button>
        <button type="submit" class="btn-primary" id="save-task-btn">Save Task</button>
      </div>
    </form>
  </dialog>

  <!-- Delete Confirmation Dialog -->
  <dialog id="delete-modal" aria-labelledby="delete-dialog-title">
    <div class="modal-header">
      <h2 id="delete-dialog-title">Delete Task</h2>
      <button type="button" class="close-btn close-modal" aria-label="Close dialog">✕</button>
    </div>
    <div class="modal-body">
      <p style="color: var(--text-secondary); font-size: 0.95rem;">
        Are you sure you want to delete this task? This action cannot be undone.
      </p>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" id="cancel-delete-btn">Cancel</button>
      <button type="button" class="btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </dialog>

  <!-- Toast Notification Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
