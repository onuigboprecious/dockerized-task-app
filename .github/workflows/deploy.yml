name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Test Backend Job
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm ci
          npm install --no-save jest
          npm test

  # 2. Build Frontend Docker Image Job
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: test-backend # Optional: runs after tests pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Optional: If pushing to a registry like Docker Hub or GitHub Packages (GHCR)
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false # Set to true if you are pushing to a registry
          tags: taskapp-frontend:${{ github.run_id }},taskapp-frontend:latest

  # 3. Deploy to Task Machine Job
  deploy:
    name: Deploy to Task Machine
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # If your 'task machine' is a remote server, use SSH to deploy:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TASK_MACHINE_HOST }}
          username: ${{ secrets.TASK_MACHINE_USER }}
          key: ${{ secrets.TASK_MACHINE_SSH_KEY }}
          script: |
            cd /var/www/taskapp
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker compose ps
